[package]
name = "folio-reader"
version = "0.1.0"
description = "A local PDF reading app"
authors = ["Folio"]
edition = "2021"

[lib]
name = "folio_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
